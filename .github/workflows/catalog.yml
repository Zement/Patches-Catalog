name: Catalog

# entries/*.json -> catalog.json. A pull request is only checked; a push to
# main rebuilds catalog.json and commits it when it changed.

on:
  push:
    branches: [main]
    paths: ['entries/**', 'scripts/build_catalog.py']
  pull_request:
    paths: ['entries/**', 'scripts/build_catalog.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the entries
        run: python scripts/build_catalog.py --check
      - name: Build catalog.json
        if: github.event_name != 'pull_request'
        run: python scripts/build_catalog.py
      - name: Commit catalog.json
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "chore: rebuild catalog.json"
            git push
          fi
